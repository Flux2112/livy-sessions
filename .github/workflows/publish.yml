name: Publish

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the runner mint a GitHub OIDC token, which Entra ID exchanges for
      # an access token. This is what replaces the long-lived Marketplace PAT.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Signs the Azure CLI in via workload identity federation: no secret is
      # stored, the runner proves its identity with a short-lived OIDC token.
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      # Byte-for-byte the call vsce's AzureCliCredential makes, so a pass here
      # means the publish step will authenticate. Runs before the version bump
      # so a broken federation cannot leave a bumped version and a pushed tag
      # with no release behind them. Prints the expiry only, never the token.
      - name: Verify Marketplace credential
        run: |
          az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query expiresOn -o tsv

      - name: Sync, bump, commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          npm version minor --no-git-tag-version -w @livy/extension
          git commit -am "chore: bump minor version [skip ci]"
          git push origin HEAD:main

      - name: Git tag
        run: |
          VERSION=$(node -p "require('./packages/extension/package.json').version")
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Build
        run: npm run build -w @livy/extension

      - name: Package
        run: npm run package -w @livy/extension

      # vsce resolves an Entra ID token through its credential chain, which
      # picks up the Azure CLI session established above. Requires vsce >= 2.26.1.
      - name: Publish
        working-directory: packages/extension
        run: npx vsce publish --azure-credential

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: 'packages/extension/*.vsix'
